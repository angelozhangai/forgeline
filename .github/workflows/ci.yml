name: CI

# Two gates in one workflow:
#  - pull_request: CI on the PR. It has to be green before a merge, and marking it a required check in the
#    branch protection ruleset is what turns it into a hard gate.
#  - push to main: CI on the trunk, a post-merge regression run that keeps main always runnable.
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR or branch cancels the run still in flight -- it saves runner time and gives
# faster feedback.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Matches the local development runtime; node:sqlite and node:test need no flag on this version.
          node-version: '26'
          cache: npm

      # A clean, reproducible install straight from the lockfile, with no implicit changes to it.
      - run: npm ci

      # The same set of checks as `npm run ci` locally: biome lint, tsc in strict mode, and node:test.
      # The coverage floors stop coverage degrading silently, and the test-count floor stops a run that
      # exited before every file reported from silently running fewer tests.
      # Both gates have to hold remotely too -- caught locally but not in CI is the same as not caught.
      - run: npm run lint
      - run: npm run typecheck
      - run: tools/test-with-floor.sh npm run test:cov

      # The dependency vulnerability gate (high and above) runs remotely only: audit queries the registry over
      # the network, and the local pre-commit hook has to work offline, so it stays out of `npm run ci`.
      - run: npm run audit
