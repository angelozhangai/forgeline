# The permission gate: the allow lists for triggering gate B and for the go that really creates issues and
# commits (short codes, case-insensitive).
# An unauthorised attempt records permission_denied, says so, and moves the session nowhere.

gate_b_allowed: [M, BD]   # who may trigger gate B, producing the technical plan
go_approvers: [M]         # who may give the go-ahead, creating the issues and committing the tech design

# Downstream, each of which falls back to go_approvers when unset:
gate_c_allowed: [M]       # who may trigger gate C, implementing in an isolated worktree and running local CI
pr_create_approvers: [M]  # who may open the PR and trigger gate D -- an outward write, so it needs a human
merge_ack_allowed: [M]    # who may confirm a PR was merged by hand, reaching SHIPPED and entering the drift loop

# For a team, optionally: map the IM open_id to a short code, so a card button is ruled on by whoever really
# pressed it rather than always as the maintainer.
# Leaving it empty or deleting it means single-person dogfooding, where every card action keeps the old
# behaviour and counts as the maintainer.
# Configured but with an open_id absent from the table means that person lands on no allow list, so the
# permission check refuses them -- it never escalates them by impersonating the maintainer.
# operators:
#   ou_xxxxxxxxxxxxxxxx: M
#   ou_yyyyyyyyyyyyyyyy: BD
