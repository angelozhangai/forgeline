# Runtime settings (nothing secret). Secrets and the environment live in config/forge.env, inside the service
# repo and gitignored.

poll_interval_sec: 180       # how often the poller and the periodic tick run
max_parallel: 2              # cap on concurrent claude/codex processes (an expensive resource). Start at 2-3; the knob goes to about 5
parse_repair_retries: 2      # when an LLM emits bad JSON or breaks the contract, how many times to resume the same session and ask again before parking
max_fix_failures: 5          # circuit breaker: this many consecutive failed fix(claude) calls -- timeouts, crashes, a persistent fault -- park the gate as STALLED for a human rather than spinning forever (the same idea as an SQS maxReceiveCount)

branches:
  prod: main                 # the production baseline
  dev: dev                   # the development integration baseline
default_branch: prod         # which line the gates analyse by default (prod=main is the production truth; a review always anchors on the latest main)

repos: [demo, example-web, example-admin, example-engine]

# On go, publish the tech-design document to the main repo automatically (commit, PR, merge -- see
# scripts/publish-tech-design.sh).
# Turning it off (enabled:false) goes back to leaving the document in the working tree for someone to commit
# by hand. base is main for now, and may be changed to dev.
tech_design_publish:
  enabled: true
  base: main

# Document sources. The Feishu source is always present; plaintext treats "@bot plus a paragraph" as the
# requirement body itself, needing no document service at all.
# Off by default. Once it is on, @-mentioning the bot in a channel with a paragraph of text (35 weighted units
# or more once normalised) really does file a requirement and run gate A -- which **spends money
# automatically**. Today a message with no document link is simply ignored. Turning it on is worth it mainly
# for a setup like Slack, where there is no document service.
doc_sources:
  plaintext:
    enabled: false

adversarial:
  reviewer: codex            # codex | claude
  on_missing: claude         # when codex is absent: claude (degrade to the same engine reviewing itself, so less independent) | skip | error
  max_rounds: 3              # hard cap on gate B's codex-reviews / claude-revises loop: still unresolved at the cap -> GATE_B_STALLED for the maintainer to rule on (at most 2 rounds per tick, with the rest carried to the next)

gate_a:
  max_pm_rounds: 5           # cap on the rounds of review with product: still open at the cap -> park for the maintainer to rule on, which is what stops claude looping and burning money

# Downstream gate C (implement plus local CI): claude implements in an isolated worktree and runs the
# project's CI and the outer-loop acceptance until everything is green. The reviewer here is deterministic CI
# and acceptance -- there is no codex.
gate_c:
  max_rounds: 4              # hard cap on the implement/CI repair loop: still not green at the cap -> GATE_C_STALLED for the maintainer
  max_rounds_per_tick: 1     # CI is heavy, so one round per tick at most, which keeps it from monopolising the tick lock
  ci_timeout_sec: 1800       # timeout for a single local CI run (a large Nx monorepo is on the slow side)
  claude_timeout_sec: 2400   # timeout for one claude call that writes whole files (the global default is 1200; downstream implementation is far heavier than reviewing a document upstream, so it gets more room)

# Downstream gate D (adversarial PR review, test hardening and merge readiness): codex reviews the diff and
# claude revises, with CI running inside the fix.
gate_d:
  max_rounds: 3
  max_rounds_per_tick: 1
  ci_timeout_sec: 1800
  claude_timeout_sec: 2400   # timeout for one claude call revising or hardening at the PR level (the global default is 1200; another heavy downstream call)
  harden:
    forbid_mirror_tests: true   # no mirror tests
    require_failure_path: true  # the failure path has to be covered
    require_auth_path: true     # the permission path has to be covered

# Graduated autonomy: for a session parked at a **purely authorising** pause point -- one where a person just
# presses a button and supplies no information -- the daemon's tick presses it for you. **The default, 0, is
# fully manual.**
#   level 0  fully manual (the current default, and no change in behaviour at all)
#   level 1  produce the technical plan automatically (CONFIRMED -> gate B; internal and reversible, with no outward write)
#   level 2  give the go-ahead automatically (create the issues and publish the plan; an outward write and a commitment to spend. An automatic go never passes --force, so a failed acceptance lint or assignment leaves it to a human)
#   level 3  start the implementation automatically (DONE -> gate C; a local worktree plus CI)
#   level 4  open the PR automatically (gate D; outward, but reviewable)
# **Never automatic** -- red lines no level breaks: the human merge (AWAITING_HUMAN_MERGE), skipping a
# deterministic gate (CI that is not green), and any *_STALLED or *_INPUT state, which needs a person to rule
# or to answer.
# actor is the short code an automatic action is attributed to. It has to be on the matching allow list, or
# the action is refused and left to a human; unset, it falls back to routing.lead. Every automatic action
# records an autonomy_auto_triggered audit event.
# It can be overridden per project: give an entry in config/projects.yaml its own
# autonomy: { level, actor } -- which is a way to switch it on for a low-risk project first.
autonomy:
  level: 0
  # actor: M

# The scripts the downstream mechanical actions delegate to. This is the default project's fallback; a project
# such as your-monorepo overrides it in config/projects.yaml.
# Paths are relative to the target project's root. Never hardcode pnpm, nx or prisma here -- what runs is the
# target project's own script's business. The default project (demo) ships no downstream scripts yet, so this
# is commented out.
# scripts:
#   worktree_add: ./tools/scripts/wt.sh
#   ci: ./scripts/forge-ci.sh
#   diff: ./scripts/forge-diff.sh
#   create_pr: ./scripts/forge-create-pr.sh
#   checks: ./scripts/forge-checks.sh

# What gate A and gate B anchor their review on: claude reads the live checkout, so if that checkout is not on
# the anchored origin/main -- wrong branch, behind, or a dirty tree -- the review is of code that is neither
# anchored nor shipped. warn discloses the drift in the prompt so the model knows and carries on (the default,
# which keeps it usable); block parks the session (strict).
gates:
  checkout_anchor: warn

# The post-filing drift loop (off by default): once every issue of a DONE requirement is closed, meaning the
# implementation has landed on main, run claude once to reconcile the merged implementation against gate B's
# acceptance contract, and send the maintainer a direct message if it has drifted. Switched on
# (enabled:true), it polls on the tick's own rhythm: each requirement is audited once and never re-run;
# poll_every_hours limits how often gh and claude are called; and max_polls caps the backoff, so an issue that
# stays unmerged, or an audit that keeps failing, is eventually given up on with an alert rather than burning
# tokens indefinitely.
# Turning this on **spends money automatically** -- one claude reconciliation per requirement once it lands --
# and sends the maintainer direct messages. Off by default; turn it on when you want it.
drift:
  enabled: false
  poll_every_hours: 24
  max_polls: 8

retry:
  max_auto_retries: 3        # cap on automatic backoff retries for transient errors -- a claude/codex timeout, rate limiting, the network, a flaky git fetch -- at 30s, 2min and 5min. Exhausted, it parks as a dead letter for a human
  max_reclaims: 3            # cap on automatically recovering an orphaned session, one whose process died mid-gate. Exhausted, it goes to the dead letter, which stops a deterministically crashing session from looping crash-restart-burn-tokens forever

# The local CLIs, used as they are once logged in.
claude_bin: claude
codex_bin: codex
claude_allowed_tools: "Read,Grep,Glob,Bash"   # gate analysis is read-only, and pre-approving these avoids a prompt
claude_timeout_sec: 1200

# Liveness and health (the local status page plus the watchdog). The port can be overridden by the
# FORGE_HEALTH_PORT environment variable. It binds to 127.0.0.1 only.
health:
  port: 4319                 # the port for the local health service and status page (http://127.0.0.1:4319/)
  liveness_ping_sec: 10      # how often the daemon pings its own liveness -- gates run asynchronously and do not block the event loop, which makes this a genuine signal of life
  wedged_after_sec: 90       # liveness not updated for this long -> the process is judged wedged
  wedged_grace_sec: 300      # with a gate still running, how much longer to wait after that before killing it, so an in-flight claude or codex call is not interrupted and its tokens wasted
  probe_fail_threshold: 3    # how many consecutive /healthz failures the watchdog needs before acting (debouncing a momentary blip)
  sample_interval_sec: 60    # how often a health sample is written to the database, for the rolling history
  history_retain_hours: 72   # how long samples are kept (the status page draws uptime over the last 72h)
  log_rotate_mb: 20          # once logs/launchd.log passes this size, the watchdog rotates it in passing
  contract_check: true       # probe the output contracts of claude, codex, gh and the IM provider once a day. This **spends money**: one trivial call each to codex and claude, while gh and the IM provider are free
  contract_interval_hours: 24 # how often that contract probe runs (once a day by default)
