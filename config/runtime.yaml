# 运行期可调项（非密钥）。密钥/环境在 config/forge.env（服务仓内，gitignore）。

poll_interval_sec: 180       # V2 轮询/定时间隔
max_parallel: 2              # 并发 claude/codex 进程上限（贵资源）。起 2-3，旋钮到 ~5
parse_repair_retries: 2      # LLM 输出坏 JSON/不符契约时，resume 同会话回喂重出的最多次数（耗尽才停泊）
max_fix_failures: 5          # 断路器：连续 fix(claude) 调用失败（超时/崩/持续故障）到此上限 → gate STALLED 交人，绝不无限空转（对齐 SQS maxReceiveCount/断路器阈值）

branches:
  prod: main                 # 生产基线
  dev: dev                   # 开发集成基线
default_branch: prod         # 闸分析默认读哪条线（prod=main 生产真源；评审一律锚 main 最新）

repos: [demo, example-web, example-admin, example-engine]

# GO 立项时自动把技术方案 doc 发布到主仓（提交+PR+merge，见 scripts/publish-tech-design.sh）。
# 关掉(enabled:false)则回到「文档留工作树、人工提交」。base 暂走 main，可改 dev。
tech_design_publish:
  enabled: true
  base: main

adversarial:
  reviewer: codex            # codex | claude
  on_missing: claude         # codex 不在时：claude(降级同引擎自审,独立性弱) | skip | error
  max_rounds: 3              # 闸B codex审⇄claude改 对抗循环硬上限：到顶仍未消解 → GATE_B_STALLED 交 M 裁决（单 tick 内最多跑 2 轮，余下下个 tick 续）

gate_a:
  max_pm_rounds: 5           # PM 多轮评审上限：到顶仍有未决开放问题 → 停泊交 M 人工裁决（防 claude 无限循环烧钱）

# 下游闸C（实现 + 本地CI）：claude 在隔离 worktree 实现，跑项目 CI + 外环验收至全绿。reviewer=确定性 CI/验收（无 codex）。
gate_c:
  max_rounds: 4              # 实现⇄CI 修复硬上限：到顶仍不绿 → GATE_C_STALLED 交 M 裁决
  max_rounds_per_tick: 1     # CI 重，每 tick 最多 1 轮，防霸占 tick 锁
  ci_timeout_sec: 1800       # 单次本地 CI 超时（大 Nx monorepo 偏慢）
  claude_timeout_sec: 2400   # claude 整写代码单调用超时（缺省回退全局 1200；下游实现远重于上游审文档，给足头寸）

# 下游闸D（PR 对抗 review + 测试补强 + merge readiness）：codex 审 diff ⇄ claude 改（CI 夹在 fix 内）。
gate_d:
  max_rounds: 3
  max_rounds_per_tick: 1
  ci_timeout_sec: 1800
  claude_timeout_sec: 2400   # claude PR 级改方/补强单调用超时（缺省回退全局 1200；同属下游重调用）
  harden:
    forbid_mirror_tests: true   # 杜绝镜像测试
    require_failure_path: true  # 必覆盖失败路径
    require_auth_path: true     # 必覆盖权限路径

# 渐进自治：停泊在「纯授权停泊点」（人点一下就过、不需提供信息）的 session，daemon tick 自动替你点。**默认 0 = 全人工**。
#   level 0  全手工（当前默认，零行为变更）
#   level 1  自动出技术方案（CONFIRMED → 闸B；内部可逆、无外向写）
#   level 2  自动 GO（建 issue + 发方案；外向写 + 付费承诺。auto-go 不带 --force，接受度 lint/指派不过则留人工）
#   level 3  自动起实现（DONE → 闸C；本地 worktree + CI）
#   level 4  自动开 PR（闸D；外向但可审）
# **永不自动**（红线，任何等级都不破）：人工合并（AWAITING_HUMAN_MERGE）、跳确定性闸（CI 没绿）、各 *_STALLED/*_INPUT（需人裁决/答复）。
# actor：自动动作的署名短码（须在相应权限名单里，否则动作被拒、留人工）；缺省回退 routing.lead。每个自动动作落 autonomy_auto_triggered 审计事件。
# 可按项目覆盖：config/projects.yaml 各 entry 写 autonomy: { level, actor }（可在低风险项目先开）。
autonomy:
  level: 0
  # actor: M

# 下游机械动作委托脚本（默认项目兜底；your-monorepo 等在 config/projects.yaml 各自覆盖）。
# 路径相对目标项目根。绝不写死 pnpm/nx/prisma —— 由目标项目脚本内部决定。默认项目(demo)暂未提供下游脚本，故注释。
# scripts:
#   worktree_add: ./tools/scripts/wt.sh
#   ci: ./scripts/forge-ci.sh
#   diff: ./scripts/forge-diff.sh
#   create_pr: ./scripts/forge-create-pr.sh
#   checks: ./scripts/forge-checks.sh

# 闸A/闸B 评审锚定：claude 读的是活 checkout，若本地 checkout 不在锚定的 origin/main（错分支/落后/脏树），
# 等于对「非锚定/未上线」代码评审。warn=把偏移披露进 prompt 让模型知情后继续（默认，保可用）；block=停泊（严格）。
gates:
  checkout_anchor: warn

# 立项后漂移闭环（默认关）：DONE 需求的 issue 全部关闭（实现已合并 main）后，跑一次 claude 对账
# 「已合并实现 vs 闸B 验收契约」，发现漂移则私聊告警 M。开（enabled:true）后按 tick 节奏轮询：
# 每条需求审计一次（终态，不复跑）；poll_every_hours 控 gh/claude 频率；max_polls 是退避封顶（issue 久未合/审计反复失败 → 放弃并告警，不无限烧 token）。
# ⚠️ 开启=自动花钱（每条需求落地后一发 claude 对账）+ 自动私聊 M。默认关，按需开。
drift:
  enabled: false
  poll_every_hours: 24
  max_polls: 8

retry:
  max_auto_retries: 3        # 瞬时错(claude/codex 超时·限流·网络·git fetch 抖)自动退避重试上限(30s/2min/5min)，耗尽 → 死信停泊交人
  max_reclaims: 3            # 孤儿态(进程跑 gate 中途死)自动复位上限，耗尽 → 死信（防确定性崩溃 session 无限崩溃-重启-烧 token 环）

# 本机 CLI（已登录态直接用）
claude_bin: claude
codex_bin: codex
claude_allowed_tools: "Read,Grep,Glob,Bash"   # 闸分析只读，预批免弹窗
claude_timeout_sec: 1200

# 保活/健康（本地状态页 + 看门狗）。端口可被 env FORGE_HEALTH_PORT 覆盖。仅绑 127.0.0.1。
health:
  port: 4319                 # 本地健康服务/状态页端口（http://127.0.0.1:4319/）
  liveness_ping_sec: 10      # 守护内 liveness ping 间隔——gate 异步不堵 event loop，这是真·判活信号
  wedged_after_sec: 90       # liveness 超过此久没更新 → 判进程卡死
  wedged_grace_sec: 300      # 有 gate 在跑时，卡死后再宽限这么久才强杀（避免打断 claude/codex 白烧 token）
  probe_fail_threshold: 3    # 看门狗 /healthz 连续失败几次才动手（去抖瞬时抖动）
  sample_interval_sec: 60    # 健康采样落库间隔（滚动历史）
  history_retain_hours: 72   # 采样保留时长（状态页画近 72h 在线率）
  log_rotate_mb: 20          # logs/launchd.log 超过此大小则看门狗顺手轮转
  contract_check: true       # 每日主动探测 claude/codex/gh/飞书 输出契约（=自动花钱：codex+claude 各一发 trivial 调用，gh/飞书免费）
  contract_interval_hours: 24 # 契约探测间隔（默认每日一次）
