# Assignment when a requirement is filed: the pool to pick from, and how load and WIP are counted.
# Automatic assignment is least-loaded plus a WIP limit: this requirement's size points are added to each
# person's current in-flight load, and whoever projects lowest without exceeding their WIP limit is chosen.
# The short codes are the same set as routing.yaml's reviewers, and resolveLogin turns them into logins.

# The pool of DRIs that may be assigned, automatically or by hand (as short codes).
pool: [M, EO, CC, DE]

# Each person's cap on concurrent in-flight requirements (the WIP limit). At the cap, automatic assignment
# skips them -- unless everyone is at their cap, in which case it falls back to the whole pool.
wip_limit:
  default: 3
  M: 2          # the maintainer also leads and reviews, so their capacity is smaller

# "In flight" means an issue in one of these rollup states, matching weekly-load's quality axis:
# 4 in development, 5 in review, 6 in testing.
# State 7 (shipped) and anything else, including issues with no status at all, do not count towards the
# current load -- only work actually in hand does.
in_progress_statuses: [4, 5, 6]
