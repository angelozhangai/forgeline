# 闸A 路由：每个需求由谁评审（M vs 该需求 DRI 自评）。
# 注意：路由只决定「@谁来确认」，不决定是否停——AWAITING_PM_CONFIRM 必停等人。
# route_to_M 若任一：repos_touched>1（跨仓） / 命中 sensitive_areas / confidence<min_confidence / envelope.needs_lead
# 否则 route_to_engineer（DRI 自评）。envelope 缺失/乱码 → 当低置信 → fail-safe 给 M。

min_confidence: 0.7
sensitive_areas: [auth, pay, payment, membership, credit, 风控, risk, risk-control, db-migration, migration]

