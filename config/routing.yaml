# Gate A routing: who reviews each requirement -- the maintainer, or the requirement's own DRI.
# Note that routing only decides who gets @-mentioned to confirm, never whether it stops:
# AWAITING_PM_CONFIRM always waits for a person.
# It routes to the maintainer if any of these hold: repos_touched > 1 (it spans repos), it hits
# sensitive_areas, confidence < min_confidence, or the envelope sets needs_lead.
# Otherwise it routes to the engineer, who reviews their own. A missing or unparseable envelope counts as low
# confidence and fails safe to the maintainer.

min_confidence: 0.7
sensitive_areas: [auth, pay, payment, membership, credit, risk, risk-control, db-migration, migration]

# Short code -> GitHub login (the same mapping the main repo's resolve_assignee script uses)
reviewers:
  M: alice-lead
  BD: bob-dev
  CC: carol-codes
  DE: dave-eng
  EO: "erin-ops"

lead: M   # who an escalation goes to, and who gets @-mentioned when it routes to the maintainer
