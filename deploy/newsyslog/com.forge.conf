# Optional alternative: rotate the logs with macOS's own newsyslog, by size and on a schedule (needs sudo).
# You do not need this file by default -- the watchdog already rotates logs/launchd.log according to
# health.log_rotate_mb.
# To hand the job to the system instead, watchdog.log included, put your own absolute path in this file and
# then:
#   sudo cp deploy/newsyslog/com.forge.conf /etc/newsyslog.d/
#   sudo newsyslog -nv   # a dry run, to check it over first
#
# Fields: logfilename                                             mode count size(KB) when flags
/path/to/forge/logs/launchd.log    644  5     20480    *    GJ
/path/to/forge/logs/watchdog.log   644  3     5120     *    GJ
