# 可选/备选：用 macOS 原生 newsyslog 按大小+周期轮转日志（需 sudo）。
# 默认无需此文件——看门狗已按 health.log_rotate_mb 轮转 logs/launchd.log。
# 若想交给系统统一管理（含 watchdog.log），把本文件路径改成你的绝对路径后：
#   sudo cp deploy/newsyslog/com.forge.conf /etc/newsyslog.d/
#   sudo newsyslog -nv   # 预演，确认无误
#
# 字段： logfilename                                              mode count size(KB) when flags
/path/to/forge/logs/launchd.log    644  5     20480    *    GJ
/path/to/forge/logs/watchdog.log   644  3     5120     *    GJ
